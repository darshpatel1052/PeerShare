openapi: 3.1.1
info:
  title: PeerScreen catalogue API
  version: 1.0.0
  description: Identity, creator media and public catalogue contract. Mutations require the exact configured Origin header. Cookie sessions are stored as hashes and checked against PostgreSQL on each authenticated request.
servers:
  - url: /
paths:
  /api/v1/auth/options:
    get:
      operationId: authenticationOptions
      responses:
        "200":
          description: Available authentication methods; never returns client credentials.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthOptions" }
  /api/v1/auth/methods:
    get:
      operationId: connectedAuthenticationMethods
      security: [{ session: [] }]
      responses:
        "200":
          description: Current user's sign-in methods.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthMethods" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/auth/google/start:
    post:
      operationId: startGoogleSignIn
      description: Creates a ten-minute browser-bound one-use OAuth flow with state, nonce and S256 PKCE. Requires the configured Origin. Does not auto-link email collisions.
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200":
          description: Authorization URL plus HttpOnly flow cookie; browser navigates to Google.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthRedirect" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/auth/google/link:
    post:
      operationId: startGoogleConnection
      security: [{ session: [] }]
      description: Requires the current local password. The callback must retain this exact active session; no email-based account merge or provider reassignment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Authorization URL plus flow cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthRedirect" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/auth/google/callback:
    get:
      operationId: finishGoogleAuthentication
      description: Consumes matching state and browser binding once, exchanges code with PKCE, validates signed ID token and nonce, then creates an existing database-backed PeerScreen session or explicitly connects the identity. No provider access or refresh tokens are persisted.
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string, maxLength: 2048 }
        - name: error
          in: query
          schema: { type: string }
      responses:
        "303":
          description: Fixed same-origin account/settings destination with a product result code. Login sets the existing HttpOnly session cookie. Callback always uses no-store and no-referrer.
          headers:
            Location:
              schema: { type: string, format: uri }
  /api/v1/channels/{id}/banner:
    parameters:
      - { $ref: "#/components/parameters/ResourceID" }
      - name: If-Match
        in: header
        required: true
        schema: { type: integer, minimum: 1 }
        description: Current channel or video revision.
    put:
      operationId: setBanner
      security: [{ session: [] }]
      description: Owner-only JPG/PNG upload. At most 5 MiB and 6 million pixels; re-encoded as JPEG. Artwork does not change playback generations.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Image saved and revision incremented.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      operationId: resetBanner
      security: [{ session: [] }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200":
          description: Default restored and revision incremented.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/videos/{id}/thumbnail:
    parameters:
      - { $ref: "#/components/parameters/ResourceID" }
      - name: If-Match
        in: header
        required: true
        schema: { type: integer, minimum: 1 }
        description: Current channel or video revision.
    put:
      operationId: setThumbnail
      security: [{ session: [] }]
      description: Owner-only JPG/PNG upload. At most 5 MiB and 6 million pixels; re-encoded as JPEG. Artwork does not change playback generations.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Image saved and revision incremented.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThumbnailUpdate" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      operationId: resetThumbnail
      security: [{ session: [] }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200":
          description: Default restored and revision incremented.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThumbnailUpdate" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/images/{id}:
    get:
      operationId: creatorImage
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      description: Only currently selected images are readable. Banners are public; video thumbnails require publication or the owning session. Retired/deleted/unpublished images return 404 to visitors.
      responses:
        "200":
          description: Normalized JPEG image; no-store to respect later unpublishing.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/auth/register:
    post:
      operationId: register
      description: Development registration creates a user and initial session in one transaction. Disabled in production until an admission policy is implemented.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Registration" }
      responses:
        "201":
          description: Account and session created; HttpOnly session cookie set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Signed in; HttpOnly session cookie set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      description: Idempotently revoke the presented session and clear its cookie. Does not require an active session.
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "204": { description: Session revoked and cookie cleared. }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAll
      security: [{ session: [] }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "204":
          {
            description: All current user's sessions revoked,
            including the current session.,
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/me:
    get:
      operationId: me
      security: [{ session: [] }]
      responses:
        "200":
          description: Authenticated user and optional owned channel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/channels:
    post:
      operationId: createChannel
      security: [{ session: [] }]
      description: Create the authenticated user's sole channel. Owner ID is assigned from the session and is not accepted in JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelCreate" }
      responses:
        "201":
          description: Channel created; Location identifies its API resource.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/channels/{id}:
    parameters:
      - { $ref: "#/components/parameters/ResourceID" }
    get:
      operationId: getChannel
      responses:
        "200":
          description: Public channel metadata without owner email or private account data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    patch:
      operationId: editChannel
      security: [{ session: [] }]
      description: Owner-only edit, serialized with a row lock and guarded by the expected revision.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelEdit" }
      responses:
        "200":
          description: Updated metadata and incremented revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/videos:
    get:
      operationId: listVideos
      description: Only published, nondeleted videos. Cursor order is published_at DESC, id DESC; UUID breaks timestamp ties.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 30, default: 12 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 512 }
        - name: channel_id
          in: query
          schema: { type: string, format: uuid }
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
          description: PostgreSQL word/phrase search over titles, tags and descriptions, plus literal creator-name matching. Results remain chronological.
        - name: feed
          in: query
          schema: { type: string, enum: [following] }
          description: Requires a current cookie session; includes only followed channels.
      responses:
        "200":
          description: Bounded page with a nullable cursor for the next page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideosPage" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/videos/{id}:
    parameters:
      - { $ref: "#/components/parameters/ResourceID" }
    get:
      operationId: getVideo
      description: Playback configuration for an accepted published generation. Draft, unpublished, deleted and unknown IDs return 404.
      responses:
        "200":
          description: Video metadata and accepted playback URLs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    patch:
      operationId: editVideo
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoEdit" }
      responses:
        "204":
          {
            description: Owner metadata updated with optimistic revision check.,
          }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteVideo
      security: [{ session: [] }]
      responses:
        "204":
          {
            description: Video hidden immediately; durable cleanup will release capacity.,
          }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/uploads:
    get:
      operationId: listUploads
      security: [{ session: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 30 },
          }
        - {
            name: state,
            in: query,
            schema:
              {
                type: string,
                enum: [all, draft, published, unpublished],
                default: all,
              },
          }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Paginated creator library with whole-library publication counts and title/description search.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadsPage" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createUpload
      security: [{ session: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUpload" }
      responses:
        "201":
          description: Private draft and durable chunk-upload session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
        "200": { description: Idempotent retry returned the existing session. }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/uploads/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: getUpload
      security: [{ session: [] }]
      description: Authoritative upload state and checksummed chunks for safe resume.
      responses:
        "200":
          description: Upload session owned by the signed-in creator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: abortUpload
      security: [{ session: [] }]
      responses:
        "204": { description: Open upload cancelled. }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/uploads/{id}/parts/presign:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    post:
      operationId: grantUploadParts
      security: [{ session: [] }]
      description: Local transport permissions, scoped to the owner and each part for at most ten minutes. These are not S3 presigned URLs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [numbers]
              properties:
                numbers:
                  {
                    type: array,
                    minItems: 1,
                    maxItems: 3,
                    uniqueItems: true,
                    items: { type: integer, minimum: 1, maximum: 32 },
                  }
      responses:
        "200":
          description: Fresh chunk permissions; keep tokens in memory only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartGrants" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/videos/{id}/preview:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: previewVideo
      security: [{ session: [] }]
      responses:
        "200":
          description: Owner-only ready draft playback; peer sharing disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoPreview" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/videos/{id}/processing:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: getProcessing
      security: [{ session: [] }]
      responses:
        "200":
          description: Private processing and publication state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/videos/{id}/processing/retry:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    post:
      operationId: retryProcessing
      security: [{ session: [] }]
      responses:
        "204":
          {
            description: Failed or cancelled job requeued,
            up to three total attempts. Equivalent queued/running retries are no-ops.,
          }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/videos/{id}/processing/cancel:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    post:
      operationId: cancelProcessing
      security: [{ session: [] }]
      responses:
        "204":
          {
            description: Attempt invalidated; late completion cannot make the draft ready.,
          }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/uploads/{id}/abort:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    post:
      operationId: abortUploadPost
      security: [{ session: [] }]
      responses:
        "204":
          {
            description: Idempotent upload abort; cleanup releases the reservation.,
          }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/uploads/{id}/parts/{number}:
    parameters:
      - { $ref: "#/components/parameters/ResourceID" }
      - name: Upload-Token
        in: header
        required: true
        schema: { type: string }
      - name: number
        in: path
        required: true
        schema: { type: integer, minimum: 1, maximum: 32 }
    put:
      operationId: uploadPart
      security: [{ session: [] }]
      description: Streams one numbered 8 MiB maximum raw binary chunk to private local storage. Repeated identical chunks are safe.
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "200": { description: Chunk stored and SHA-256 recorded. }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/uploads/{id}/complete:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    post:
      operationId: completeUpload
      security: [{ session: [] }]
      responses:
        "202":
          { description: Source assembled and durable processing job queued. }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/videos/{id}/publish:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    post:
      operationId: publishVideo
      security: [{ session: [] }]
      description: Owner-only publication, accepted only after processing has produced a complete playable generation.
      responses:
        "200":
          {
            description: Video is now visible in public channel and catalogue queries.,
          }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/videos/{id}/unpublish:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    post:
      operationId: unpublishVideo
      security: [{ session: [] }]
      responses:
        "200":
          {
            description: Video is no longer visible in public catalogue queries.,
          }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/media/{key}:
    get:
      operationId: getProcessedMedia
      description: Serves a ready immutable media generation publicly after publication, or privately to its owner.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          {
            description: HLS playlist,
            MPEG-TS segment,
            thumbnail or integrity descriptor.,
          }
        "404": { $ref: "#/components/responses/Error" }
  /health/live:
    get:
      operationId: liveness
      responses:
        "200": { description: Process is serving requests. }
  /health/ready:
    get:
      operationId: readiness
      responses:
        "200": { description: PostgreSQL and Redis are reachable. }
        "503": { description: A required dependency is unavailable. }
  /api/v1/channels/{id}/subscription:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: channelSubscription
      description: Public follower count; following reflects a valid current cookie session when present.
      responses:
        "200":
          description: Current relationship and count.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      operationId: followChannel
      security: [{ session: [] }]
      description: Idempotent pair; at most 500 followed channels per account.
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200":
          description: Followed relationship.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      operationId: unfollowChannel
      security: [{ session: [] }]
      responses:
        "200":
          description: Unfollowed relationship; repeated removal is safe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/subscriptions:
    get:
      operationId: followedChannels
      security: [{ session: [] }]
      responses:
        "200":
          description: Account's complete bounded list, at most 500 channels.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscriptions" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/playlists:
    get:
      operationId: ownPlaylists
      security: [{ session: [] }]
      responses:
        "200":
          description: Own playlists, at most 50; item_count includes unavailable saved items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlists" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      operationId: createPlaylist
      security: [{ session: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      description: Stable actor/key/input returns the existing logical playlist; changed input conflicts. Deleted keys cannot recreate the playlist. At most 50 playlists and 500 retained creation keys per account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistCreate" }
      responses:
        "201":
          description: Created or safely replayed playlist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlist" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/playlists/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: getPlaylist
      description: Public playlists show only currently published videos. Private playlists require their owner. Only the owner sees unavailable video IDs with null video metadata, enabling removal.
      responses:
        "200":
          description: Consistent playlist snapshot, at most 200 items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    patch:
      operationId: editPlaylist
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistEdit" }
      responses:
        "200":
          description: Updated playlist snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deletePlaylist
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistRevision" }
      responses:
        "204": { description: Deleted; a later read/removal returns 404. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/playlists/{id}/items:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    post:
      operationId: addPlaylistVideo
      security: [{ session: [] }]
      description: Adds a published video once, at the end. At most 200 items; current revision required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistItemAdd" }
      responses:
        "200":
          description: Updated snapshot; already-saved item remains unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/playlists/{id}/items/{video_id}:
    parameters:
      - { $ref: "#/components/parameters/ResourceID" }
      - name: video_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removePlaylistVideo
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistRevision" }
      responses:
        "200":
          description: Updated snapshot with contiguous positions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/playlists/{id}/order:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    put:
      operationId: reorderPlaylist
      security: [{ session: [] }]
      description: Full permutation of saved video IDs and current revision; row lock and deferred unique positions make the reorder atomic.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistOrder" }
      responses:
        "200":
          description: Reordered snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/playback/sessions:
    post:
      operationId: startPlaybackMeasurements
      description: Public published-video-only two-hour capability, bound to the current generation/attempt. No account identity is attached. Maximum 30 starts per minute per transport address, 20000 retained sessions and 200000 accepted batches globally; 30-day retention.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [video_id, generation_id, attempt_id, measurement_mode]
              properties:
                video_id: { type: string, format: uuid }
                generation_id: { type: string, format: uuid }
                attempt_id: { type: string, format: uuid }
                measurement_mode:
                  { type: string, enum: [verified_hls, native_hls] }
      responses:
        "201":
          description: Ephemeral reporting capability; retain only in player memory. Never use as an account session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackSession" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/playback/telemetry:
    post:
      operationId: reportPlaybackMeasurements
      security: [{ playback: [] }]
      description: Strict cumulative counters, sequence 1–720 and current public generation. Stable session/sequence/body replays once; changed input or regressed counters conflicts. Sequence gaps are allowed; unseen older sequences conflict. Absolute/delta and elapsed-wall-time bounds apply. Native HLS must report unknown payload as zero. At most 40 reports per minute per capability. Accepted metrics, batch hash and Kafka outbox event commit together.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [session_id, sequence, metrics]
              properties:
                session_id: { type: string, format: uuid }
                sequence: { type: integer, minimum: 1, maximum: 720 }
                metrics: { $ref: "#/components/schemas/PlaybackMetrics" }
      responses:
        "200":
          description: Highest accepted sequence and current qualifying-play state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackAck" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/channels/{id}/analytics:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: creatorAnalytics
      security: [{ session: [] }]
      description: Owner-only thirty-day browser-reported measurements. Totals cover all nondeleted owned videos, including unpublished ones; detail table is bounded to the latest 200 videos. Qualifying plays count one session reaching 30 seconds, or half a shorter video with a one-second minimum. Not unique viewers, wire bytes or billed savings.
      responses:
        "200":
          description: Consistent totals and per-video observations; zero-denominator ratios and missing startup averages are null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorAnalytics" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/videos/{id}/analytics:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: videoAnalytics
      security: [{ session: [] }]
      description: Same owner-only measurement contract scoped to one nondeleted video.
      responses:
        "200":
          description: Totals and one video row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorAnalytics" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    playback:
      type: apiKey
      in: header
      name: Playback-Token
      description: Random temporary playback capability, stored only as SHA-256; grants reporting for one public generation, never account permissions.
    session:
      type: apiKey
      in: cookie
      name: peerscreen_session
      description: Development cookie name; production uses __Host-peerscreen_session with Secure and no Domain attribute.
  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    Empty:
      required: true
      content:
        application/json:
          schema: { type: object, additionalProperties: false }
  responses:
    Error:
      description: Structured error with stable code, readable message, and server-generated request ID. Rate-limited responses also provide Retry-After seconds.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/APIError" }
  schemas:
    PlaybackSession:
      type: object
      required: [session_id, token, expires_at, measurement_mode]
      properties:
        session_id: { type: string, format: uuid }
        token: { type: string, minLength: 43, maxLength: 43 }
        expires_at: { type: string, format: date-time }
        measurement_mode: { type: string, enum: [verified_hls, native_hls] }
    PlaybackMetrics:
      type: object
      additionalProperties: false
      required:
        [
          played_ms,
          http_bytes,
          peer_bytes,
          uploaded_bytes,
          rebuffer_ms,
          rebuffer_count,
          verified_segments,
          rejected_segments,
          quality,
          peer_sharing,
          startup_ms,
        ]
      properties:
        played_ms: { type: integer, minimum: 0, maximum: 7200000 }
        http_bytes: { type: integer, minimum: 0, maximum: 2147483648 }
        peer_bytes: { type: integer, minimum: 0, maximum: 2147483648 }
        uploaded_bytes: { type: integer, minimum: 0, maximum: 17179869184 }
        rebuffer_ms: { type: integer, minimum: 0, maximum: 7200000 }
        rebuffer_count: { type: integer, minimum: 0, maximum: 10000 }
        verified_segments: { type: integer, minimum: 0, maximum: 100000 }
        rejected_segments: { type: integer, minimum: 0, maximum: 100000 }
        quality: { type: integer, minimum: 0, maximum: 720 }
        peer_sharing: { type: boolean }
        startup_ms: { type: [integer, "null"], minimum: 0, maximum: 120000 }
    PlaybackAck:
      type: object
      required: [last_sequence, duplicate, qualified]
      properties:
        last_sequence: { type: integer, minimum: 1, maximum: 720 }
        duplicate: { type: boolean }
        qualified: { type: boolean }
    PlaybackTotals:
      type: object
      required:
        [
          sessions,
          qualified_plays,
          played_ms,
          http_bytes,
          peer_bytes,
          uploaded_bytes,
          rebuffer_ms,
          rebuffer_count,
          verified_sessions,
          native_sessions,
          startup_average_ms,
          peer_delivery_share,
        ]
      properties:
        sessions: { type: integer, minimum: 0 }
        qualified_plays: { type: integer, minimum: 0 }
        played_ms: { type: integer, minimum: 0 }
        http_bytes: { type: integer, minimum: 0 }
        peer_bytes: { type: integer, minimum: 0 }
        uploaded_bytes: { type: integer, minimum: 0 }
        rebuffer_ms: { type: integer, minimum: 0 }
        rebuffer_count: { type: integer, minimum: 0 }
        verified_sessions: { type: integer, minimum: 0 }
        native_sessions: { type: integer, minimum: 0 }
        startup_average_ms: { type: [number, "null"], minimum: 0 }
        peer_delivery_share: { type: [number, "null"], minimum: 0, maximum: 1 }
    CreatorAnalytics:
      type: object
      required: [period_days, totals, videos]
      properties:
        period_days: { type: integer, enum: [30] }
        totals: { $ref: "#/components/schemas/PlaybackTotals" }
        videos:
          type: array
          maxItems: 200
          items:
            type: object
            required: [video_id, title, totals]
            properties:
              video_id: { type: string, format: uuid }
              title: { type: string }
              totals: { $ref: "#/components/schemas/PlaybackTotals" }
    Subscription:
      type: object
      required: [following, followers]
      properties:
        following: { type: boolean }
        followers: { type: integer, minimum: 0 }
    Subscriptions:
      type: object
      required: [items]
      properties:
        items:
          {
            type: array,
            maxItems: 500,
            items: { $ref: "#/components/schemas/Channel" },
          }
    Playlist:
      type: object
      required:
        [id, title, visibility, revision, item_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        visibility: { type: string, enum: [private, public] }
        revision: { type: integer, minimum: 1 }
        item_count: { type: integer, minimum: 0, maximum: 200 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Playlists:
      type: object
      required: [items]
      properties:
        items:
          {
            type: array,
            maxItems: 50,
            items: { $ref: "#/components/schemas/Playlist" },
          }
    PlaylistDetail:
      type: object
      required: [playlist, is_owner, items]
      properties:
        playlist: { $ref: "#/components/schemas/Playlist" }
        is_owner: { type: boolean }
        items:
          type: array
          maxItems: 200
          items:
            type: object
            required: [video_id, position, video]
            properties:
              video_id: { type: string, format: uuid }
              position: { type: integer, minimum: 0, maximum: 199 }
              video:
                anyOf:
                  - { $ref: "#/components/schemas/Video" }
                  - { type: "null" }
    PlaylistCreate:
      type: object
      additionalProperties: false
      required: [title, visibility]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        visibility: { type: string, enum: [private, public] }
    PlaylistEdit:
      type: object
      additionalProperties: false
      required: [title, visibility, revision]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        visibility: { type: string, enum: [private, public] }
        revision: { type: integer, minimum: 1 }
    PlaylistRevision:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: integer, minimum: 1 }
    PlaylistItemAdd:
      type: object
      additionalProperties: false
      required: [video_id, revision]
      properties:
        video_id: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
    PlaylistOrder:
      type: object
      additionalProperties: false
      required: [video_ids, revision]
      properties:
        video_ids:
          {
            type: array,
            maxItems: 200,
            uniqueItems: true,
            items: { type: string, format: uuid },
          }
        revision: { type: integer, minimum: 1 }
    AuthOptions:
      type: object
      required: [google_enabled, registration_enabled]
      properties:
        google_enabled: { type: boolean }
        registration_enabled: { type: boolean }
    AuthMethods:
      type: object
      required: [password, google_email]
      properties:
        password: { type: boolean }
        google_email: { type: [string, "null"] }
    OAuthRedirect:
      type: object
      required: [authorization_url]
      properties:
        authorization_url: { type: string, format: uri }
    ThumbnailUpdate:
      type: object
      required: [revision, thumbnail_url, has_custom_thumbnail]
      properties:
        revision: { type: integer }
        thumbnail_url:
          {
            type: string,
            description: Empty after resetting to the generated frame.,
          }
        has_custom_thumbnail: { type: boolean }
    APIError:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string, format: uuid }
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          {
            type: string,
            minLength: 1,
            maxLength: 128,
            description: Maximum 128 UTF-8 bytes is enforced by the server.,
          }
    Registration:
      type: object
      additionalProperties: false
      required: [email, password, display_name]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          {
            type: string,
            minLength: 12,
            maxLength: 128,
            description: At least 12 Unicode characters and at most 128 UTF-8 bytes; never trimmed.,
          }
        display_name: { type: string, minLength: 1, maxLength: 80 }
    User:
      type: object
      required: [id, email, display_name, role, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { type: string, enum: [member, operator, system] }
        created_at: { type: string, format: date-time }
    ChannelCreate:
      type: object
      additionalProperties: false
      required: [handle, title]
      properties:
        handle: { type: string, pattern: "^[a-z][a-z0-9-]{1,28}[a-z0-9]$" }
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000, default: "" }
    ChannelEdit:
      type: object
      additionalProperties: false
      required: [title, description, revision]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        revision: { type: integer, minimum: 1 }
    Channel:
      type: object
      required:
        [
          id,
          handle,
          title,
          description,
          owner_display_name,
          banner_url,
          revision,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        title: { type: string }
        description: { type: string }
        owner_display_name: { type: string }
        banner_url:
          { type: string, description: Empty when using the default banner. }
        revision: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Me:
      type: object
      required: [user, channel]
      properties:
        user: { $ref: "#/components/schemas/User" }
        channel:
          oneOf:
            - { $ref: "#/components/schemas/Channel" }
            - { type: "null" }
    Video:
      type: object
      required:
        [
          id,
          channel_id,
          channel_title,
          channel_handle,
          title,
          description,
          tags,
          source_kind,
          duration_seconds,
          accepted_generation_id,
          accepted_attempt_id,
          qualities,
          published_at,
          thumbnail_url,
        ]
      properties:
        id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        channel_title: { type: string }
        channel_handle: { type: string }
        title: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        source_kind: { type: string, enum: [fixture, upload] }
        duration_seconds: { type: integer }
        accepted_generation_id: { type: string, format: uuid }
        accepted_attempt_id: { type: string, format: uuid }
        qualities: { type: array, items: { type: integer } }
        published_at: { type: string, format: date-time }
        thumbnail_url: { type: string, format: uri }
    Playback:
      type: object
      required:
        [manifest_url, integrity_url, tracker_url, peer_sharing_available]
      properties:
        manifest_url: { type: string, format: uri }
        integrity_url: { type: string, format: uri }
        tracker_url: { type: string, format: uri }
        peer_sharing_available: { type: boolean }
        stun_urls:
          type: array
          maxItems: 3
          items: { type: string }
          description: Trusted runtime STUN-only URLs; empty by default. Contacted only after explicit sharing consent.
    VideoPreview:
      type: object
      required:
        [
          id,
          title,
          thumbnail_url,
          accepted_generation_id,
          accepted_attempt_id,
          playback,
        ]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        thumbnail_url: { type: string, format: uri }
        accepted_generation_id: { type: string, format: uuid }
        accepted_attempt_id: { type: string, format: uuid }
        playback: { $ref: "#/components/schemas/Playback" }
    VideoDetail:
      allOf:
        - { $ref: "#/components/schemas/Video" }
        - type: object
          required: [playback]
          properties:
            playback: { $ref: "#/components/schemas/Playback" }
    VideosPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Video" } }
        next_cursor: { type: [string, "null"] }
    CreateUpload:
      type: object
      additionalProperties: false
      required: [channel_id, title, description, tags, size]
      properties:
        channel_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        tags:
          {
            type: array,
            maxItems: 10,
            items: { type: string, minLength: 1, maxLength: 32 },
          }
        size: { type: integer, minimum: 1, maximum: 262144000 }
        part_checksums:
          type: array
          maxItems: 32
          description: Optional for legacy clients; the studio supplies all part hashes before admission to verify file identity on resume.
          items: { type: string, pattern: "^[a-f0-9]{64}$" }
    VideoEdit:
      type: object
      additionalProperties: false
      required: [title, description, tags, revision]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        tags:
          {
            type: array,
            maxItems: 10,
            items: { type: string, minLength: 1, maxLength: 32 },
          }
        revision: { type: integer, minimum: 1 }
    PartGrants:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          maxItems: 3
          items:
            type: object
            required: [number, url, token, bytes, expires_at]
            properties:
              number: { type: integer }
              url: { type: string }
              token: { type: string }
              bytes: { type: integer }
              expires_at: { type: string, format: date-time }
    Upload:
      type: object
      required:
        [
          id,
          video_id,
          title,
          description,
          tags,
          revision,
          part_checksums,
          job_id,
          thumbnail_url,
          has_custom_thumbnail,
          expected_bytes,
          part_bytes,
          parts,
          state,
          processing_state,
          processing_stage,
          progress,
          publication_state,
          expires_at,
        ]
      properties:
        id: { type: string, format: uuid }
        video_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        revision: { type: integer }
        part_checksums: { type: array, items: { type: string } }
        job_id: { type: [string, "null"], format: uuid }
        thumbnail_url: { type: string }
        has_custom_thumbnail: { type: boolean }
        expected_bytes: { type: integer }
        part_bytes: { type: integer }
        parts:
          type: array
          items:
            type: object
            required: [number, bytes, sha256]
            properties:
              number: { type: integer }
              bytes: { type: integer }
              sha256: { type: string }
        state: { type: string, enum: [open, completed, aborted, expired] }
        processing_state:
          {
            type: string,
            enum: [pending, processing, ready, failed, cancelled],
          }
        processing_stage: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100 }
        error_code: { type: [string, "null"] }
        publication_state:
          { type: string, enum: [draft, published, unpublished] }
        expires_at: { type: string, format: date-time }
    UploadsPage:
      type: object
      required: [items, next_cursor, counts, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Upload" } }
        next_cursor: { type: [string, "null"] }
        total: { type: integer, minimum: 0 }
        counts:
          type: object
          required: [all, draft, published, unpublished]
          properties:
            all: { type: integer, minimum: 0 }
            draft: { type: integer, minimum: 0 }
            published: { type: integer, minimum: 0 }
            unpublished: { type: integer, minimum: 0 }
