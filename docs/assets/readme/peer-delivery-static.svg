<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
<title id="title">Verified HTTP and WebRTC delivery</title><desc id="desc">Static illustration of authorized HTTP delivery and opt-in verified peer exchange, with HTTP available independently of peers.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="1278" height="398" rx="24" fill="#151c19" stroke="#37453c" /><text x="38" y="38" font-size="12" fill="#ffab8c" font-weight="700" letter-spacing="2">HOW A SEGMENT REACHES THE PLAYER</text><text x="36" y="82" font-size="34" fill="#f5f2e9" font-weight="700" >HTTP and peers. The same integrity check.</text><rect x="40" y="130" width="280" height="130" rx="16" fill="#202925" stroke="#37453c" /><rect x="58" y="149" width="4" height="92" rx="2" fill="#9bbce2" stroke="#9bbce2" /><text x="78" y="162" font-size="12" fill="#9bbce2" font-weight="700" letter-spacing="2">PUBLISHED MEDIA</text><text x="78" y="195" font-size="23" fill="#f5f2e9" font-weight="700" >HTTPS origin</text><text x="78" y="221" font-size="16" fill="#a9b5ac" font-weight="400" >Authorized HLS fragments</text><rect x="500" y="130" width="280" height="130" rx="16" fill="#202925" stroke="#37453c" /><rect x="518" y="149" width="4" height="92" rx="2" fill="#86c4b0" stroke="#86c4b0" /><text x="538" y="162" font-size="12" fill="#86c4b0" font-weight="700" letter-spacing="2">OPTED-IN VIEWER</text><text x="538" y="195" font-size="23" fill="#f5f2e9" font-weight="700" >Browser A</text><text x="538" y="221" font-size="16" fill="#a9b5ac" font-weight="400" >Verified segment cache</text><rect x="960" y="130" width="280" height="130" rx="16" fill="#202925" stroke="#37453c" /><rect x="978" y="149" width="4" height="92" rx="2" fill="#ffab8c" stroke="#ffab8c" /><text x="998" y="162" font-size="12" fill="#ffab8c" font-weight="700" letter-spacing="2">ANOTHER VIEWER</text><text x="998" y="195" font-size="23" fill="#f5f2e9" font-weight="700" >Browser B</text><text x="998" y="221" font-size="16" fill="#a9b5ac" font-weight="400" >Verify SHA-256 → play</text><path d="M320 185H500" fill="none" stroke="#9bbce2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="341" y="147" width="120" height="27" rx="5" fill="#151c19" stroke="#151c19" /><text x="349" y="166" font-size="14" fill="#9bbce2" font-weight="500" >HTTP load</text><path d="M780 185H960" fill="none" stroke="#86c4b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="789" y="147" width="150" height="27" rx="5" fill="#151c19" stroke="#151c19" /><text x="797" y="166" font-size="14" fill="#86c4b0" font-weight="500" >WebRTC</text><path d="M180 260V309H1100V260" fill="none" stroke="#9bbce2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 6"/><rect x="420" y="290" width="510" height="27" rx="5" fill="#151c19" stroke="#151c19" /><text x="428" y="309" font-size="14" fill="#9bbce2" font-weight="500" >HTTP remains available when a peer cannot supply the segment</text><text x="40" y="365" font-size="16" fill="#a9b5ac" font-weight="400" >Conceptual illustration · consent is required · tracker carries signalling, never video · no TURN relay is operated</text></g></svg>
