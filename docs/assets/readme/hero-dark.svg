<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">PeerShare — publish your work, share the stream</title><desc id="desc">A Go and Next.js video platform with adaptive HLS and optional verified WebRTC segment delivery. The right-hand illustration shows a player using HTTP and peers.</desc>
