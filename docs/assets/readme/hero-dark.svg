 stroke="#37453c" /><path d="M827 133H1157" fill="none" stroke="#37453c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="842" cy="120" r="3" fill="#a9b5ac" opacity=".6"/><circle cx="855" cy="120" r="3" fill="#a9b5ac" opacity=".6"/><circle cx="868" cy="120" r="3" fill="#a9b5ac" opacity=".6"/><circle cx="992" cy="194" r="32" fill="#352a24"/><path d="m984 179 24 15-24 15Z" fill="#ffab8c"/><path d="M850 248H1134" fill="none" stroke="#37453c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M850 248H976" fill="none" stroke="#ffab8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M921 267V287H862V310" fill="none" stroke="#ffab8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1064 267V287H1120V310" fill="none" stroke="#86c4b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="794" y="312" width="172" height="52" rx="12" fill="#352a24" stroke="#352a24" /><text x="816" y="344" font-size="17" fill="#ffab8c" font-weight="700" >HTTPS origin</text><rect x="1018" y="312" width="180" height="52" rx="12" fill="#151c19" stroke="#37453c" /><text x="1040" y="344" font-size="17" fill="#86c4b0" font-weight="700" >Verified peers</text></g></svg>
