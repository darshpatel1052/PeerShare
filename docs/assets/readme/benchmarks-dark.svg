<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
<title id="title">PeerShare catalogue benchmark results</title><desc id="desc">200 offered API operations per second on 100,000 metadata video records across three 120-second trials. All 72,002 operations validated, with p99 at most 99 milliseconds and no failures or dropped iterations. This is an isolated synthetic workload, not customer adoption or video-viewer capacity.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="1278" height="378" rx="24" fill="#151c19" stroke="#37453c" /><text x="40" y="43" font-size="12" fill="#ffab8c" font-weight="700" letter-spacing="2">MEASURED, WITH THE WORKLOAD ATTACHED</text><text x="38" y="89" font-size="36" fill="#f5f2e9" font-weight="700" >Performance you can inspect.</text><rect x="40" y="120" width="370" height="162" rx="16" fill="#202925" stroke="#37453c" /><text x="64" y="183" font-size="45" fill="#ffab8c" font-weight="700" >200</text><text x="64" y="220" font-size="18" fill="#f5f2e9" font-weight="600" >offered API operations / sec</text><text x="64" y="253" font-size="15" fill="#a9b5ac" font-weight="400" >100k metadata video records</text><rect x="455" y="120" width="370" height="162" rx="16" fill="#202925" stroke="#37453c" /><text x="479" y="183" font-size="45" fill="#ffab8c" font-weight="700" >≤99 ms</text><text x="479" y="220" font-size="18" fill="#f5f2e9" font-weight="600" >p99 in all three steady trials</text><text x="479" y="253" font-size="15" fill="#a9b5ac" font-weight="400" >2 vCPU / 8 GiB shared AWS host</text><rect x="870" y="120" width="370" height="162" rx="16" fill="#202925" stroke="#37453c" /><text x="894" y="183" font-size="45" fill="#ffab8c" font-weight="700" >72,002</text><text x="894" y="220" font-size="18" fill="#f5f2e9" font-weight="600" >validated API operations</text><text x="894" y="253" font-size="15" fill="#a9b5ac" font-weight="400" >Zero failures or dropped iterations</text><text x="42" y="320" font-size="17" fill="#a9b5ac" font-weight="400" >Catalogue: three 120-second trials · 10k synthetic accounts · external k6 generator over a private tunnel.</text><text x="42" y="348" font-size="17" fill="#a9b5ac" font-weight="400" >These are API measurements, not concurrent-viewer capacity. Raw records and failed load levels are published.</text></g></svg>
