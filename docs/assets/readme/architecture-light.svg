<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1200" viewBox="0 0 1280 1200" role="img" aria-labelledby="title desc">
<title id="title">PeerShare complete logical architecture</title><desc id="desc">The browser uses CloudFront and Envoy for the Go API and tracker, and shares verified fragments directly with opted-in viewers. PostgreSQL stores separate catalogue and media schemas. Redis supplies analytics cache and rate limiting. The coordinator uses Kafka dispatch notifications and gRPC worker control; FFmpeg writes HLS to private S3. Lifecycle events update the catalogue. GitHub OIDC, Terraform and private observability support the deployment.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
