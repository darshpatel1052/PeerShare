services:
  bench-api:
    image: ${API_IMAGE:?}
    command: [serve]
    env_file: [/srv/peerscreen/benchmark/api.env]
    networks: [lab, backend]
    deploy: { replicas: 2 }
    read_only: true
    tmpfs: [/tmp:size=64m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 1
    healthcheck:
      test: [CMD, /peerscreen, healthcheck]
      interval: 3s
      timeout: 4s
      retries: 20
    logging: { driver: local, options: { max-size: 10m, max-file: "2" } }
  bench-gateway:
    image: envoyproxy/envoy:v1.39.4@sha256:74bd4eb5629708d3fadca1a5e6b85d208f338d7bb54e06b69565905c5294cc01
    user: "10001:10001"
    command:
      [envoy, -c, /config/envoy.json, --concurrency, "2", --log-level, warning]
    volumes:
      - /srv/peerscreen/benchmark/envoy.json:/config/envoy.json:ro
      - /srv/peerscreen/tls:/tls:ro
    ports: [127.0.0.1:38443:8443, 127.0.0.1:29902:9901]
    networks: [lab]
    read_only: true
    tmpfs: [/tmp:size=32m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    depends_on: { bench-api: { condition: service_healthy } }
    logging: { driver: local, options: { max-size: 10m, max-file: "2" } }
networks:
  lab: {}
  backend: { external: true, name: peerscreen_default }
