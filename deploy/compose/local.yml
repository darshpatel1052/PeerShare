x-api-environment: &api-environment
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  PEER_STUN_URLS: ${PEER_STUN_URLS-stun:stun.cloudflare.com:3478}
  EXPOSE_OPERATOR_FIXTURE: ${EXPOSE_OPERATOR_FIXTURE:-false}
  APP_ENV: development
  APP_ORIGIN: http://localhost:${PEERSCREEN_WEB_PORT:-3000}
  MEDIA_BASE_URL: http://localhost:${PEERSCREEN_WEB_PORT:-3000}/media/
  UPLOAD_DIR: /app/.local/uploads
  MEDIA_DIR: /app/.local/media
  TRACKER_URL: ws://localhost:${PEERSCREEN_TRACKER_PORT:-8000}
  API_LISTEN_ADDR: 0.0.0.0:8080
  MEDIA_GRPC_ADDR: media:9090
  CATALOG_RPC_TOKEN: ${CATALOG_RPC_TOKEN}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  DATABASE_URL: postgres://peerscreen_catalog:${CATALOG_DB_PASSWORD}@postgres:5432/peerscreen?sslmode=disable
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

services:
  postgres:
    image: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_DB: peerscreen
      POSTGRES_USER: peerscreen_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the local setup command first}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Run the local setup command first}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD:?Run the local setup command first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../postgres/init-catalog.sh:/docker-entrypoint-initdb.d/10-catalog.sh:ro
      - ../postgres/bootstrap-media.sh:/docker-entrypoint-initdb.d/20-media.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U peerscreen_admin -d peerscreen && psql -U peerscreen_admin -d peerscreen -tAc "SELECT 1 FROM pg_roles WHERE rolname=''peerscreen_catalog''" | grep -qx 1',
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    cpus: 2
  redis:
    image: redis:8-bookworm@sha256:47670742d7924adbcdb404d1288b6327815b23141969c0939b8e5d61f78c2634
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run the local setup command first}
    command:
      [
        "sh",
        "-c",
        'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 64mb --maxmemory-policy noeviction --save '''' --appendonly no',
      ]
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG',
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 128m
    cpus: 1
  media-bootstrap:
    profiles: [app]
    image: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: peerscreen_admin
      POSTGRES_DB: peerscreen
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD}
    command: ["/bin/sh", "/bootstrap-media.sh"]
    volumes: ["../postgres/bootstrap-media.sh:/bootstrap-media.sh:ro"]
    depends_on:
      postgres: { condition: service_healthy }
  kafka:
    image: apache/kafka:4.2.2@sha256:1213eb3943d551e5ed1fca7a4e109001cee35770b66a02a0c37a8964efe09b69
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 67108864
      KAFKA_MESSAGE_MAX_BYTES: 2097152
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
    ports: ["127.0.0.1:${KAFKA_PORT:-19092}:9094"]
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'KAFKA_HEAP_OPTS="-Xms32m -Xmx96m" /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 768m
    cpus: 1.5
  kafka-topics:
    profiles: [app]
    image: apache/kafka:4.2.2@sha256:1213eb3943d551e5ed1fca7a4e109001cee35770b66a02a0c37a8964efe09b69
    environment: { KAFKA_HEAP_OPTS: "-Xms32m -Xmx96m" }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for topic in peerscreen.media.dispatch.v1 peerscreen.media.lifecycle.v1 peerscreen.playback.telemetry.v1 peerscreen.events.dlq.v1; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1 --config retention.ms=86400000 --config retention.bytes=67108864 || exit 1;
        done
    depends_on: { kafka: { condition: service_healthy } }
    mem_limit: 160m
  migrate:
    profiles: [app]
    image: peerscreen-api:local
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
      network: ${PEERSCREEN_BUILD_NETWORK:-default}
    command: [migrate]
    environment: *api-environment
    depends_on:
      postgres: { condition: service_healthy }
  seed:
    profiles: [app]
    image: peerscreen-api:local
    command: [seed-fixture, /fixture/fixture.json]
    environment: *api-environment
    volumes:
      - ../../.local/media/fixture:/fixture:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
  api:
    profiles: [app]
    image: peerscreen-api:local
    environment: *api-environment
    depends_on:
      seed: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      media: { condition: service_healthy }
      kafka-topics: { condition: service_completed_successfully }
    ports: ["127.0.0.1:${PEERSCREEN_API_PORT:-18080}:8080"]
    healthcheck:
      test: [CMD, /peerscreen, healthcheck]
      interval: 3s
      timeout: 4s
      retries: 20
    read_only: true
    volumes:
      - upload-data:/app/.local/uploads
      - media-data:/app/.local/media
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 2
  media-migrate:
    profiles: [app]
    image: peerscreen-api:local
    entrypoint: [/peerscreen-media]
    command: [migrate]
    environment: &media-environment
      APP_ENV: development
      MEDIA_DATABASE_URL: postgres://peerscreen_media:${MEDIA_DB_PASSWORD}@postgres:5432/peerscreen?sslmode=disable
      MEDIA_DIR: /app/.local/media
      MEDIA_LISTEN_ADDR: 0.0.0.0:9090
      CATALOG_RPC_TOKEN: ${CATALOG_RPC_TOKEN}
      WORKER_RPC_TOKEN: ${WORKER_RPC_TOKEN}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      { media-bootstrap: { condition: service_completed_successfully } }
  media:
    profiles: [app]
    image: peerscreen-api:local
    entrypoint: [/peerscreen-media]
    environment: *media-environment
    depends_on:
      media-migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
    volumes: ["media-data:/app/.local/media:ro"]
    healthcheck:
      test: [CMD, /peerscreen-media, healthcheck]
      interval: 3s
      timeout: 5s
      retries: 20
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 1
  worker:
    profiles: [app]
    image: peerscreen-api:local
    entrypoint: [/peerscreen-worker]
    environment:
      APP_ENV: development
      MEDIA_GRPC_ADDR: media:9090
      WORKER_RPC_TOKEN: ${WORKER_RPC_TOKEN}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      UPLOAD_DIR: /app/.local/uploads
      MEDIA_DIR: /app/.local/media
    depends_on:
      media: { condition: service_healthy }
      kafka-topics: { condition: service_completed_successfully }
    volumes:
      - upload-data:/app/.local/uploads:ro
      - media-data:/app/.local/media
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 2
  web:
    profiles: [app]
    image: peerscreen-web:local
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      network: ${PEERSCREEN_BUILD_NETWORK:-default}
    environment:
      API_TARGET: http://api:8080
      DEMO_BIND_HOST: 0.0.0.0
    depends_on:
      api: { condition: service_healthy }
    ports:
      [
        "127.0.0.1:${PEERSCREEN_WEB_PORT:-3000}:3000",
        "127.0.0.1:${PEERSCREEN_MEDIA_PORT:-3001}:3001",
        "127.0.0.1:${PEERSCREEN_TRACKER_PORT:-8000}:8000",
      ]
    volumes:
      - media-data:/app/.local/media:ro
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 4s
      retries: 20
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
  storage-init:
    profiles: [app]
    image: peerscreen-api:local
    entrypoint: ["/bin/sh", "-c"]
    command:
      [
        "mkdir -p /app/.local/media/fixture && if [ ! -f /app/.local/media/fixture/integrity.json ]; then cp -a /fixture/. /app/.local/media/fixture/; fi && chown 10001:10001 /app/.local/uploads /app/.local/media",
      ]
    user: "0:0"
    volumes:
      - upload-data:/app/.local/uploads
      - media-data:/app/.local/media
      - ../../.local/media/fixture:/fixture:ro

volumes:
  postgres-data:
  upload-data:
  media-data:
  kafka-data:
