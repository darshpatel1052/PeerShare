# Optional private operators: add this overlay and enable --profile ops.
services:
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SAMPLE_RATIO: ${OTEL_SAMPLE_RATIO:-0.1}
  media:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SAMPLE_RATIO: ${OTEL_SAMPLE_RATIO:-0.1}
  worker:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SAMPLE_RATIO: "1"
  prometheus:
    profiles: [ops]
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=128MB
      - --storage.tsdb.wal-segment-size=32MB
    volumes:
      - ../operations/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:${PEERSCREEN_PROMETHEUS_PORT:-19091}:9090"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.5
    restart: unless-stopped
  grafana:
    profiles: [ops]
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Create private operator settings first}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../operations/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../operations/grafana/dashboards:/etc/grafana/dashboards:ro
    ports: ["127.0.0.1:${PEERSCREEN_GRAFANA_PORT:-3301}:3000"]
    read_only: true
    tmpfs: [/tmp:size=16m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 320m
    cpus: 0.5
    restart: unless-stopped
  jaeger:
    profiles: [ops]
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    command: [--config, /config/jaeger.yml]
    environment: { GOMEMLIMIT: 160MiB }
    volumes: ["../operations/jaeger.yml:/config/jaeger.yml:ro"]
    ports: ["127.0.0.1:${PEERSCREEN_JAEGER_PORT:-16686}:16686"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.5
    restart: unless-stopped
volumes:
  prometheus-data:
  grafana-data:
